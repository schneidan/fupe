services:
  postgres:
    image: apache/age:latest
    container_name: fupe-postgres
    restart: unless-stopped
    ports:
      # Localhost only — not exposed on the public interface
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fupe}
      # Prefer POSTGRES_PASSWORD in a gitignored .env (Compose loads it automatically).
      # Default is for local dev only — never put prod/staging secrets in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fupe_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fupe}
    volumes:
      # PG 18+ images require mounting at /var/lib/postgresql (not .../data)
      - fupe_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fupe -d fupe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fupe_pgdata:
