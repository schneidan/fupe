# Staging Postgres + Apache AGE (same VPS as prod, different port/volume)

# Usage (same project name always — avoids container_name conflicts across dirs):
#   docker compose -p fupe-staging -f docker-compose.staging.yml up -d
#
# Host port 5434 → container 5432. Do not conflict with prod on 5433.
# Never use --remove-orphans on this file (prod compose may share the host).
#
# Set STAGING_POSTGRES_PASSWORD in a gitignored .env (distinct from prod
# POSTGRES_PASSWORD so one VPS .env can hold both). Changing the password after
# the volume already exists does not re-init Postgres — keep it stable and match
# the staging DATABASE_URL.

services:
  postgres-staging:
    image: apache/age:latest
    container_name: fupe-postgres-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fupe}
      # Prefer STAGING_POSTGRES_PASSWORD in a gitignored .env (distinct from prod POSTGRES_PASSWORD).
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fupe}
    volumes:
      - fupe_pgdata_staging:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fupe -d fupe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fupe_pgdata_staging:
