name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @fupe/web lint

      - name: Build API
        run: pnpm --filter @fupe/api build

      - name: Build web
        run: pnpm --filter @fupe/web build
        env:
          NEXT_PUBLIC_SITE_URL: https://fupe.app
          API_URL: http://127.0.0.1:3000

      - name: Unit tests (API)
        run: pnpm --filter @fupe/api test

      - name: Smoke — auth redirect sanitize
        run: pnpm exec ts-node --transpile-only --compiler-options '{"module":"commonjs","moduleResolution":"node","esModuleInterop":true}' apps/web/src/lib/safe-next.smoke.ts
